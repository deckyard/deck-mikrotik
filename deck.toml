[package]
name = "@deckyard/mikrotik"
version = "0.5.0"
description = "A MikroTik RouterOS API client: commands, query words, tagged commands and /listen streams over plain TCP or api-ssl"
license = "LGPL-3.0-only"
authors = ["mplx <mplx@jennifer-lang.dev>"]
# The deck talks to a router's API service over TCP (and TLS), so it opens
# sockets. No `exec`, no `sql`.
capabilities = ["net"]
keywords = ["mikrotik", "routeros", "router", "api", "network"]

[package.urls]
deck = "https://raw.githubusercontent.com/deckyard/deck-mikrotik/main/deck.toml"
homepage = "https://github.com/deckyard/deck-mikrotik"
manual = "https://deckyard.github.io/deck-mikrotik/"

# Only the default binary: `jennifer-tiny` has no `net` capability.
[engines]
jennifer = ">=0.28.0"
